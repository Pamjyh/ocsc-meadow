name: Deploy OCSC Meadow to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap project files from Drive zip (first run only)
        if: ${{ !hashFiles('package.json') }}
        run: |
          curl -fSL "https://drive.google.com/uc?export=download&id=145dEZStrtgSOC9lFHh-YDGa-UWXt-5X7" -o /tmp/ocsc-meadow.zip
          unzip -o /tmp/ocsc-[invalid URL] -d /tmp/extracted
          rm -rf /tmp/extracted/ocsc-meadow/.github
          cp -a /tmp/extracted/ocsc-meadow/. .
          git config [invalid URL] "github-actions[bot]"
          git config [invalid URL] "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial commit: OCSC Meadow"
          git push origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run unit tests
        run: npm test

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Build production bundle
        env:
          VITE_GAS_URL: ${{ vars.VITE_GAS_URL }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ [invalid URL]_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
